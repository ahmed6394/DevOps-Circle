server {
    listen 80;
    server_name _;
    resolver 10.43.0.10 valid=10s;
    root /usr/share/nginx/html;
    index index.html;
    location /api/auth/ { rewrite ^/api/auth/(.*)$ /$1 break; set $backend http://auth-service:8000; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/user/ { rewrite ^/api/user/(.*)$ /$1 break; set $backend http://user-service:8000; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/post/ { rewrite ^/api/post/(.*)$ /$1 break; set $backend http://post-service:8000; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/like/ { rewrite ^/api/like/(.*)$ /$1 break; set $backend http://like-service:8000; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/comment/ { rewrite ^/api/comment/(.*)$ /$1 break; set $backend http://comment-service:8000; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/analytics/ { rewrite ^/api/analytics/(.*)$ /$1 break; set $backend http://analytics-service:8000; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location / { try_files $uri /index.html; }
}
