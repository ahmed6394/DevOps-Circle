server {
    listen 80;
    listen [::]:80;
    server_name _;
    resolver 10.43.0.10 valid=10s;
    root /usr/share/nginx/html;
    index index.html;
    location /api/auth/ { set $backend http://auth-service.devops-circle.svc.cluster.local:8000; rewrite ^/api/auth/(.*)$ /$1 break; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/user/ { set $backend http://user-service.devops-circle.svc.cluster.local:8000; rewrite ^/api/user/(.*)$ /$1 break; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/post/ { set $backend http://post-service.devops-circle.svc.cluster.local:8000; rewrite ^/api/post/(.*)$ /$1 break; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/like/ { set $backend http://like-service.devops-circle.svc.cluster.local:8000; rewrite ^/api/like/(.*)$ /$1 break; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/comment/ { set $backend http://comment-service.devops-circle.svc.cluster.local:8000; rewrite ^/api/comment/(.*)$ /$1 break; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/analytics/ { set $backend http://analytics-service.devops-circle.svc.cluster.local:8000; rewrite ^/api/analytics/(.*)$ /$1 break; proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location / { try_files $uri /index.html; }
}