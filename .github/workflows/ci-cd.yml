name: DevOps Circle CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write
  actions: read

concurrency:
  group: devops-circle-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variable: Settings > Secrets and variables > Actions > Variables.
  # Set DOCKERHUB_USERNAME before the first push, or the image refs below are empty.
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  tests:
    name: Tests and Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          for file in services/*/requirements.txt; do pip install -r "$file"; done

      - name: Run Python tests
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run frontend smoke tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security:
    name: Security and Code Quality
    runs-on: ubuntu-latest
    needs: tests
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: DevOps Circle
          path: .
          format: HTML
          out: dependency-check-report
          args: >-
            --enableRetired
            --failOnCVSS 9

      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: dependency-check-report

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    name: Build, Scan, and Push Docker Images
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            image: devops-circle-frontend
          - service: auth-service
            context: ./services/auth-service
            image: devops-circle-auth-service
          - service: user-service
            context: ./services/user-service
            image: devops-circle-user-service
          - service: post-service
            context: ./services/post-service
            image: devops-circle-post-service
          - service: like-service
            context: ./services/like-service
            image: devops-circle-like-service
          - service: comment-service
            context: ./services/comment-service
            image: devops-circle-comment-service
          - service: analytics-service
            context: ./services/analytics-service
            image: devops-circle-analytics-service
          - service: worker-service
            context: ./services/worker-service
            image: devops-circle-worker-service
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image locally for Trivy
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

  gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Kubernetes image tags
        run: |
          python scripts/update-kustomize-images.py "${IMAGE_TAG}"

      - name: Commit GitOps image updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No GitOps changes to commit."
          else
            git add k8s/overlays/prod/kustomization.yaml
            git commit -m "chore(gitops): deploy ${IMAGE_TAG}"
            git push
          fi

  cd-verify:
    name: Verify ArgoCD Runtime Deployment
    runs-on: ubuntu-latest
    needs: gitops
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
    steps:
      - name: Validate EC2 verification secrets
        run: |
          test -n "${EC2_HOST}" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "${EC2_USER}" || (echo "Missing EC2_USER secret" && exit 1)
          test -n "${EC2_SSH_PRIVATE_KEY}" || (echo "Missing EC2_SSH_PRIVATE_KEY secret" && exit 1)
          echo "EC2_SSH_PORT=${EC2_SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST" || { echo "EC2_HOST is missing"; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER is missing"; exit 1; }
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "EC2_SSH_PRIVATE_KEY is missing"; exit 1; }
          test -n "$EC2_SSH_PORT" || { echo "EC2_SSH_PORT is missing"; exit 1; }

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/devops_circle_ec2
          chmod 600 ~/.ssh/devops_circle_ec2

          ssh-keyscan -p "$EC2_SSH_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/devops_circle_ec2 \
            -p "$EC2_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'"

      - name: Verify ArgoCD sync, Kubernetes rollout, and app metrics
        run: |
          ssh -i ~/.ssh/devops_circle_ec2 -p "${EC2_SSH_PORT}" "${EC2_USER}@${EC2_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "==> Checking Kubernetes node"
          kubectl get nodes

          echo "==> Refreshing ArgoCD application"
          kubectl -n argocd annotate application devops-circle argocd.argoproj.io/refresh=hard --overwrite || true

          echo "==> Waiting for ArgoCD application to become Synced and Healthy"
          for i in $(seq 1 60); do
            sync_status=$(kubectl -n argocd get application devops-circle -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            health_status=$(kubectl -n argocd get application devops-circle -o jsonpath='{.status.health.status}' 2>/dev/null || true)
            echo "Attempt ${i}: sync=${sync_status:-unknown}, health=${health_status:-unknown}"
            if [ "$sync_status" = "Synced" ] && [ "$health_status" = "Healthy" ]; then
              break
            fi
            sleep 10
          done

          final_sync=$(kubectl -n argocd get application devops-circle -o jsonpath='{.status.sync.status}')
          final_health=$(kubectl -n argocd get application devops-circle -o jsonpath='{.status.health.status}')
          test "$final_sync" = "Synced"
          test "$final_health" = "Healthy"

          echo "==> Verifying DevOps Circle rollouts"
          kubectl -n devops-circle rollout status deployment/frontend --timeout=300s
          kubectl -n devops-circle rollout status deployment/auth-service --timeout=300s
          kubectl -n devops-circle rollout status deployment/user-service --timeout=300s
          kubectl -n devops-circle rollout status deployment/post-service --timeout=300s
          kubectl -n devops-circle rollout status deployment/like-service --timeout=300s
          kubectl -n devops-circle rollout status deployment/comment-service --timeout=300s
          kubectl -n devops-circle rollout status deployment/analytics-service --timeout=300s
          kubectl -n devops-circle rollout status deployment/worker-service --timeout=300s
          kubectl -n devops-circle rollout status statefulset/postgres --timeout=300s
          kubectl -n devops-circle rollout status statefulset/redis --timeout=300s

          echo "==> Verifying app-level Prometheus endpoints"
          kubectl -n devops-circle exec deploy/auth-service -- python -c "import urllib.request; data=urllib.request.urlopen('http://localhost:8000/prometheus', timeout=5).read().decode(); assert 'devops_circle_http_requests_total' in data; print('auth metrics ok')"
          kubectl -n devops-circle exec deploy/post-service -- python -c "import urllib.request; data=urllib.request.urlopen('http://localhost:8000/prometheus', timeout=5).read().decode(); assert 'devops_circle_post_create_requests_total' in data; print('post metrics ok')"
          kubectl -n devops-circle exec deploy/analytics-service -- python -c "import urllib.request; data=urllib.request.urlopen('http://localhost:8000/prometheus', timeout=5).read().decode(); assert 'devops_circle_http_requests_total' in data; print('analytics metrics ok')"
          kubectl -n devops-circle exec deploy/worker-service -- python -c "import urllib.request; data=urllib.request.urlopen('http://localhost:9100/metrics', timeout=5).read().decode(); assert 'devops_circle_worker_jobs_processed_total' in data; print('worker metrics ok')"

          echo "==> Checking Prometheus ServiceMonitors"
          kubectl -n devops-circle get servicemonitor devops-circle-fastapi-services devops-circle-worker-service
          kubectl -n monitoring get servicemonitor cadvisor || true

          echo "==> Verifying nginx routes /api/auth to auth-service (401 expected)"
          # The metrics checks above run inside each pod and never cross nginx. A literal
          # proxy_pass hostname is resolved once at startup, so a restarted backend keeps
          # nginx pointing at a dead IP and returns 404 while every dashboard stays green.
          # A 401 from get_current_user proves frontend -> nginx -> auth-service answered.
          code=$(kubectl -n devops-circle exec deploy/frontend -- \
            wget -q -S -O /dev/null http://localhost/api/auth/me 2>&1 | awk '/^[[:space:]]*HTTP\//{print $2}' | tail -1)
          test "$code" = "401" || { echo "Expected 401 from /api/auth/me, got ${code:-no response}"; exit 1; }
          echo "    nginx routing ok"

          echo "==> DevOps Circle runtime verification passed"
          REMOTE

  notify:
    name: DevOps Circle CI/CD Email Notification
    runs-on: ubuntu-latest
    needs: [tests, security, docker, gitops, cd-verify]
    if: always()
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      CI_EMAIL_RECIPIENT: ${{ secrets.CI_EMAIL_RECIPIENT }}
    steps:
      - name: Decide pipeline result
        id: result
        run: |
          if [[ "${{ needs.tests.result }}" == "success" && "${{ needs.security.result }}" == "success" && ("${{ needs.docker.result }}" == "success" || "${{ needs.docker.result }}" == "skipped") && ("${{ needs.gitops.result }}" == "success" || "${{ needs.gitops.result }}" == "skipped") && ("${{ needs['cd-verify'].result }}" == "success" || "${{ needs['cd-verify'].result }}" == "skipped") ]]; then
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "badge_color=#16a34a" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "badge_color=#dc2626" >> "$GITHUB_OUTPUT"
          fi

      - name: Send DevOps Circle branded email notification
        if: ${{ env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.CI_EMAIL_RECIPIENT != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT || '587' }}
          secure: false
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "DevOps Circle DevOps Circle pipeline ${{ steps.result.outputs.status }} - ${{ github.ref_name }}"
          to: ${{ env.CI_EMAIL_RECIPIENT }}
          from: DevOps Circle DevOps Circle CI/CD <${{ env.SMTP_USERNAME }}>
          html_body: |
            <div style="margin:0;padding:0;background:#0b1020;font-family:Arial,Helvetica,sans-serif;color:#e5e7eb;">
              <div style="max-width:720px;margin:0 auto;padding:28px;">
                <div style="background:linear-gradient(135deg,#151a35,#25104f 55%,#1e1b4b);border:1px solid rgba(167,139,250,.35);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(124,58,237,.25);">
                  <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">
                    <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#22d3ee);"></div>
                    <div>
                      <div style="font-size:24px;font-weight:800;color:#fff;letter-spacing:.2px;">DevOps Circle</div>
                      <div style="font-size:13px;color:#c4b5fd;">DevOps Circle Pro CI/CD Notification</div>
                    </div>
                  </div>
                  <div style="display:inline-block;background:${{ steps.result.outputs.badge_color }};color:#fff;font-weight:800;padding:10px 16px;border-radius:999px;letter-spacing:.6px;">
                    PIPELINE ${{ steps.result.outputs.status }}
                  </div>
                  <h1 style="font-size:28px;line-height:1.25;margin:22px 0 8px;color:#fff;">DevOps Circle Pro deployment update</h1>
                  <p style="font-size:15px;line-height:1.7;color:#cbd5e1;margin:0 0 22px;">
                    GitHub Actions completed the DevOps Circle pipeline with tests, security gates, DockerHub image publishing, GitOps update, and ArgoCD runtime verification status.
                  </p>
                  <table style="width:100%;border-collapse:collapse;margin:18px 0;background:rgba(15,23,42,.65);border-radius:16px;overflow:hidden;">
                    <tr><td style="padding:12px 14px;color:#a5b4fc;">Repository</td><td style="padding:12px 14px;color:#fff;font-weight:600;">${{ github.repository }}</td></tr>
                    <tr><td style="padding:12px 14px;color:#a5b4fc;">Branch</td><td style="padding:12px 14px;color:#fff;font-weight:600;">${{ github.ref_name }}</td></tr>
                    <tr><td style="padding:12px 14px;color:#a5b4fc;">Commit</td><td style="padding:12px 14px;color:#fff;font-weight:600;">${{ github.sha }}</td></tr>
                    <tr><td style="padding:12px 14px;color:#a5b4fc;">Actor</td><td style="padding:12px 14px;color:#fff;font-weight:600;">${{ github.actor }}</td></tr>
                  </table>
                  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0;">
                    <div style="background:rgba(30,41,59,.7);padding:14px;border-radius:14px;border:1px solid rgba(148,163,184,.2);"><b>Tests</b><br><span>${{ needs.tests.result }}</span></div>
                    <div style="background:rgba(30,41,59,.7);padding:14px;border-radius:14px;border:1px solid rgba(148,163,184,.2);"><b>Security</b><br><span>${{ needs.security.result }}</span></div>
                    <div style="background:rgba(30,41,59,.7);padding:14px;border-radius:14px;border:1px solid rgba(148,163,184,.2);"><b>DockerHub</b><br><span>${{ needs.docker.result }}</span></div>
                    <div style="background:rgba(30,41,59,.7);padding:14px;border-radius:14px;border:1px solid rgba(148,163,184,.2);"><b>GitOps</b><br><span>${{ needs.gitops.result }}</span></div>
                    <div style="background:rgba(30,41,59,.7);padding:14px;border-radius:14px;border:1px solid rgba(148,163,184,.2);grid-column:span 2;"><b>ArgoCD Runtime Verification</b><br><span>${{ needs['cd-verify'].result }}</span></div>
                  </div>
                  <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="display:inline-block;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;text-decoration:none;font-weight:800;padding:13px 18px;border-radius:14px;">Open Workflow Run</a>
                  <p style="margin-top:24px;color:#94a3b8;font-size:13px;line-height:1.6;">This email was sent by GitHub Actions using Gmail SMTP/App Password secrets configured for the DevOps Circle DevOps Circle Pro project.</p>
                </div>
              </div>
            </div>
          body: |
            DevOps Circle DevOps Circle pipeline ${{ steps.result.outputs.status }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}

            Tests: ${{ needs.tests.result }}
            Security: ${{ needs.security.result }}
            DockerHub: ${{ needs.docker.result }}
            GitOps: ${{ needs.gitops.result }}
            ArgoCD runtime verification: ${{ needs['cd-verify'].result }}

            Workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
