apiVersion: v1
kind: Service
metadata:
  name: comment-service
  namespace: devops-circle
  labels:
    app: comment-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: comment-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-service
  namespace: devops-circle
  labels:
    app: comment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comment-service
  template:
    metadata:
      labels:
        app: comment-service
        app.kubernetes.io/part-of: devops-circle
    spec:
      containers:
        - name: comment-service
          image: ahmed63/devops-circle-comment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devops-circle-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devops-circle-secret
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: devops-circle-config
                  key: JWT_ALGORITHM
            - name: JWT_EXPIRES_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: devops-circle-config
                  key: JWT_EXPIRES_MINUTES
            - name: DB_INIT_LOCK_ID
              valueFrom:
                configMapKeyRef:
                  name: devops-circle-config
                  key: DB_INIT_LOCK_ID
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
