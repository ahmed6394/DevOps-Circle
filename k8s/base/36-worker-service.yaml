apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: devops-circle
  labels:
    app: worker-service
spec:
  type: ClusterIP
  ports:
    - port: 9100
      targetPort: 9100
      name: metrics
  selector:
    app: worker-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: devops-circle
  labels:
    app: worker-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
        app.kubernetes.io/part-of: devops-circle
    spec:
      containers:
        - name: worker-service
          image: ahmed63/devops-circle-worker-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
              name: metrics
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devops-circle-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: devops-circle-config
                  key: REDIS_URL
            - name: POST_CREATE_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: devops-circle-config
                  key: POST_CREATE_QUEUE
            - name: WORKER_METRICS_PORT
              value: "9100"
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
