apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-circle
resources:
  - ../../base
images:
  - name: ahmed63/devops-circle-frontend
    newTag: 64a694673eb33710afddc000064de6c03c1a0d61
  - name: ahmed63/devops-circle-auth-service
    newTag: 64a694673eb33710afddc000064de6c03c1a0d61
  - name: ahmed63/devops-circle-user-service
    newTag: 64a694673eb33710afddc000064de6c03c1a0d61
  - name: ahmed63/devops-circle-post-service
    newTag: 64a694673eb33710afddc000064de6c03c1a0d61
  - name: ahmed63/devops-circle-like-service
    newTag: 64a694673eb33710afddc000064de6c03c1a0d61
  - name: ahmed63/devops-circle-comment-service
    newTag: 64a694673eb33710afddc000064de6c03c1a0d61
  - name: ahmed63/devops-circle-analytics-service
    newTag: 64a694673eb33710afddc000064de6c03c1a0d61
  - name: ahmed63/devops-circle-worker-service
    newTag: 64a694673eb33710afddc000064de6c03c1a0d61
patches:
  - target:
      kind: Ingress
      name: devops-circle-ingress
    patch: |-
      - op: add
        path: /spec/rules/-
        value:
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: frontend
                    port:
                      number: 80
