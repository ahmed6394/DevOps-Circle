apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-circle
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ahmed6394/DevOps-Circle.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-circle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
