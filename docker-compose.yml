# Project name is pinned rather than derived from the checkout directory, so a
# clone into a differently named folder still produces devops-circle-* resources.
name: devops-circle

services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-circle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devops_circle}
      POSTGRES_USER: ${POSTGRES_USER:-devops_circle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_circle_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops_circle} -d ${POSTGRES_DB:-devops_circle}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - net

  redis:
    image: redis:7-alpine
    container_name: devops-circle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - net

  auth-service:
    build: ./services/auth-service
    container_name: devops-circle-auth
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - net

  user-service:
    build: ./services/user-service
    container_name: devops-circle-user
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    networks:
      - net

  post-service:
    build: ./services/post-service
    container_name: devops-circle-post
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8000"
    networks:
      - net

  like-service:
    build: ./services/like-service
    container_name: devops-circle-like
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8000"
    networks:
      - net

  comment-service:
    build: ./services/comment-service
    container_name: devops-circle-comment
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8000"
    networks:
      - net

  analytics-service:
    build: ./services/analytics-service
    container_name: devops-circle-analytics
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8006:8000"
    networks:
      - net

  worker-service:
    build: ./services/worker-service
    container_name: devops-circle-worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net

  frontend:
    build: ./frontend
    container_name: devops-circle-frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - user-service
      - post-service
      - like-service
      - comment-service
      - analytics-service
      - worker-service
    ports:
      - "3000:80"
    networks:
      - net

volumes:
  postgres_data:
  redis_data:

networks:
  net:
    driver: bridge
